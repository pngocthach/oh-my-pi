name: Fork upstream release

on:
  schedule:
    # GitHub schedules run from the repository's default branch (main).
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream release tag (empty selects latest)"
        required: false
        type: string

concurrency:
  group: fork-upstream-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'pngocthach/oh-my-pi'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      # The schedule definition runs from main. Checkout the ACP branch for its
      # patch commits; only a deterministic release tag is pushed later.
      - name: Checkout ACP patch branch
        uses: actions/checkout@v4
        with:
          ref: fork/acp-ambient-mcp
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Resolve upstream release and replay ACP patch
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ inputs.upstream_tag }}
        run: bash .github/scripts/prepare-fork-release.sh

      - name: Check whether deterministic fork release already exists
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $RELEASE_TAG already exists; this scheduled run is a no-op."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.release_check.outputs.exists != 'true'
        run: bun install --frozen-lockfile

      - uses: bazelbuild/setup-bazelisk@v3
        if: steps.release_check.outputs.exists != 'true'

      # The standalone compiler embeds the stamped, version-matched native
      # addons. Build the exact non-musl set used by the upstream release job;
      # musl binaries deliberately embed the corresponding Linux native addons.
      - name: Build native addons for standalone binaries
        if: steps.release_check.outputs.exists != 'true'
        run: |
          set -euo pipefail
          for target in \
            linux-x64-baseline linux-x64-modern \
            linux-arm64 darwin-x64-baseline darwin-arm64 \
            win32-x64-baseline win32-arm64; do
            bun scripts/bazel-natives.ts "$target" --dest packages/natives/native
          done

      # This is the repository's canonical standalone binary builder. It emits
      - name: Build standalone release binaries
        if: steps.release_check.outputs.exists != 'true'
        run: bun run ci:release:build-binaries

      - name: Verify asset set and write SHA256SUMS.txt
        if: steps.release_check.outputs.exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            omp-darwin-arm64
            omp-darwin-x64
            omp-linux-arm64
            omp-linux-musl-arm64
            omp-linux-musl-x64
            omp-linux-x64
            omp-windows-arm64.exe
            omp-windows-x64.exe
          )
          assets=()
          for name in "${expected[@]}"; do
            file="packages/coding-agent/binaries/$name"
            test -s "$file" || { echo "Missing or empty standalone release asset: $file" >&2; exit 1; }
            assets+=("$file")
          done
          bun run ci:release:checksums SHA256SUMS.txt "${assets[@]}"
      - name: Publish rebased source tag only
        if: steps.release_check.outputs.exists != 'true'
        env:
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          RELEASE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          set -euo pipefail
          remote_tag="$(git ls-remote --refs origin "refs/tags/$RELEASE_TAG" | cut -f1)"
          if [[ -n "$remote_tag" ]]; then
            git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/release-check/$RELEASE_TAG"
            existing_commit="$(git rev-parse "refs/tags/release-check/$RELEASE_TAG^{commit}")"
            if [[ "$existing_commit" != "$RELEASE_COMMIT" ]]; then
              echo "Existing tag $RELEASE_TAG points to $existing_commit, not $RELEASE_COMMIT; refusing to replace it." >&2
              exit 1
            fi
          else
            # The release needs a GitHub-reachable commit. Push only this
            # version tag; never push or rewrite a branch.
            git tag -f "$RELEASE_TAG" "$RELEASE_COMMIT"
            git push origin "refs/tags/$RELEASE_TAG"
          fi

      - name: Publish standalone fork release
        if: steps.release_check.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.source.outputs.release_tag }}
          UPSTREAM_TAG: ${{ steps.source.outputs.upstream_tag }}
        run: |
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Oh My Pi $UPSTREAM_TAG (ACP MCP)" \
            --notes "Standalone fork build based on upstream release $UPSTREAM_TAG with the ACP ambient MCP patch replayed from fork/acp-ambient-mcp. See SHA256SUMS.txt to verify binary assets." \
            packages/coding-agent/binaries/omp-darwin-arm64 \
            packages/coding-agent/binaries/omp-darwin-x64 \
            packages/coding-agent/binaries/omp-linux-arm64 \
            packages/coding-agent/binaries/omp-linux-musl-arm64 \
            packages/coding-agent/binaries/omp-linux-musl-x64 \
            packages/coding-agent/binaries/omp-linux-x64 \
            packages/coding-agent/binaries/omp-windows-arm64.exe \
            packages/coding-agent/binaries/omp-windows-x64.exe \
            SHA256SUMS.txt
